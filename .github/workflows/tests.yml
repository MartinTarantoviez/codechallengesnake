name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov xenon

      - name: Run tests with coverage (fail under 90%)
        run: |
          python -m pytest tests/ --cov=snake --cov-report=term-missing --cov-fail-under=90

      - name: Check cyclomatic complexity (xenon, rank A)
        run: |
          xenon --max-absolute A --max-modules A --max-average A snake/
